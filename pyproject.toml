[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lighttrail"
version = "0.1.0"
description = "面向摄影场景的 AI 拍摄决策引擎"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "亓孟豪"}]
dependencies = [
    "openai>=1.40.0",
    "astral>=3.2",
    "Pillow>=10.0",
    "exifread>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2",
    "pydantic-ai-slim>=2.41,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx>=0.27",
    "tenacity>=9.0",
    "import-linter>=2.0",
]

[project.scripts]
lighttrail = "lighttrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

# ------ 架构边界门禁（B1-5 落地第一段；其余三段在目标分层就位后开启）------
# 纪律：import-linter 抓模块级分层与禁止依赖；函数内 import / 动态 import 由
# tests/test_architecture.py 的 AST 兜底；品牌字面量由同一测试静态检查。
[tool.importlinter]
root_package = "lighttrail"

[[tool.importlinter.contracts]]
name = "契约层零依赖"
type = "forbidden"
source_modules = ["lighttrail.contracts"]
forbidden_modules = [
    "lighttrail.api",
    "lighttrail.orchestrator",
    "lighttrail.tools",
    "lighttrail.memory",
    "lighttrail.infra",
    "lighttrail.llm",
    "lighttrail.adapters",
    "lighttrail.cli",
]

[[tool.importlinter.contracts]]
name = "适配器只实现端口，不被其他层反向依赖"
type = "forbidden"
source_modules = [
    "lighttrail.tools",
    "lighttrail.memory",
    "lighttrail.orchestrator",
    "lighttrail.runtime",
    "lighttrail.contracts",
    "lighttrail.infra",
]
forbidden_modules = ["lighttrail.adapters"]
# TODO(B5-4)：旧路径 shim 豁免——B3-5 把客户端实现迁入 adapters/llm/client.py 后，
# 旧路径 lighttrail.llm.client 变成 re-export shim，使 orchestrator/tools 经它传递依赖
# adapters（B5-4 删除 shim 时同删本豁免）。实测记录：B3 汇报的「lint-imports 全绿」
# 在干净环境复跑为 2 kept / 1 broken，本批补豁免后恢复全绿（B4-1 门禁修复）。
ignore_imports = ["lighttrail.llm.client -> lighttrail.adapters.llm.client"]

[[tool.importlinter.contracts]]
name = "交互层不被任何层依赖"
type = "forbidden"
source_modules = [
    "lighttrail.contracts",
    "lighttrail.tools",
    "lighttrail.memory",
    "lighttrail.runtime",
    "lighttrail.infra",
    "lighttrail.orchestrator",
    "lighttrail.adapters",
]
forbidden_modules = ["lighttrail.api", "lighttrail.cli"]

