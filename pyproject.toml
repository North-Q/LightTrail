[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lighttrail"
version = "0.1.0"
description = "面向摄影场景的 AI 拍摄决策引擎"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "亓孟豪"}]
dependencies = [
    "openai>=1.40.0",
    "astral>=3.2",
    "Pillow>=10.0",
    "exifread>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx>=0.27",
]

[project.scripts]
lighttrail = "lighttrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
